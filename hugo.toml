baseURL = "https://earthrhythm.vercel.app/"
title = "EarthRhythm"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"
theme = "hugo-theme-reimu"
hasCJKLanguage = true
enableRobotsTXT = true

[languages.zh-CN]
languageName = "简体中文"
weight = 1
hasCJKLanguage = true

[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[pagination]
pagerSize = 10

[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 2

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 3

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 4

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 5

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]
