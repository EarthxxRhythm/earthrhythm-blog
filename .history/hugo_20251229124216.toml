baseURL = "http://localhost:1313/"
title = "EarthRhythm"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"

# 如果使用 hugo.toml
theme = "hugo-theme-reimu"


# 多语言配置（可选）
[languages]
[languages.zh-CN]
languageName = "简体中文"
weight = 1
hasCJKLanguage = true

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

# 菜单配置（也可以在menus.yml中配置）
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives"
  weight = 2
[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags"
  weight = 3
[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories"
  weight = 4
[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about"
  weight = 5

# Markup配置
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        delimiters = [["\\[", "\\]"], ["$$", "$$"]]
        inlineDelimiters = [["\\(", "\\)"], ["$", "$"]]
