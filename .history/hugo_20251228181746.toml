baseURL = "http://localhost:1313/"
title = "我的博客"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"
theme = "reimu"  # 确保这里是小写"reimu"

# 多语言配置
[languages]
  [languages.zh-CN]
  languageName = "简体中文"
  weight = 1
  hasCJKLanguage = true

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

# 菜单配置
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
