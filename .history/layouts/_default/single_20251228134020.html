{{ define "main" }}
<article>
    <h1>{{ .Title }}</h1>
    <div class="meta">
        <time>{{ .Date.Format "2006-01-02" }}</time>
        {{ with .Params.tags }} | 标签: {{ range . }}<span>#{{ . }}</span>{{ end }}{{ end }}
    </div>
    <div class="content">
        {{ .Content }}
    </div>
</article>
{{ end }}
