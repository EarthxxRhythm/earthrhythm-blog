baseURL = "http://localhost:1313/"
title = "我的博客"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"
theme = "reimu"

# 多语言配置（根据文档要求）
[languages]
  [languages.zh-CN]
  languageName = "简体中文"
  weight = 1
  hasCJKLanguage = true

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

# 菜单配置（也可以在menus.yml中配置）
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1
[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives"
  weight = 2
[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags"
  weight = 3
[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories"
  weight = 4
[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about"
  weight = 5